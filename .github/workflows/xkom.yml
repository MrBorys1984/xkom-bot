name: xkom-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # co 5 minut (minimum, jakie GitHub obsługuje)
  workflow_dispatch: {}

concurrency:
  group: xkom
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # margines na pobieranie wideo + OCR przy nowych filmach
    # Domyślny token repo prywatnego ma tylko contents:read — dodajemy actions:read,
    # bo stan pobieramy z artifactów poprzednich przebiegów (API + download-artifact).
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności (ffmpeg, tesseract z polskim modelem)
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            # timeouty sieciowe — raz runner zawiesił się 15 min na apt/pip
            sudo apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-pol
          fi
          python -m pip install --quiet --timeout 60 --retries 2 -r requirements.txt

      - name: Znajdź przebieg z ostatnim stanem
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resp=$(curl -sS -w "%{http_code}" -o /tmp/art.json \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=10")
          [ "$resp" != "200" ] && head -c 300 /tmp/art.json && echo
          id=$(jq -r --argjson cur "$GITHUB_RUN_ID" \
                '[.artifacts[]? | select(.name=="xkom-state" and .workflow_run.id != $cur)]
                 | sort_by(.created_at) | reverse | (.[0].workflow_run.id // empty)' \
                /tmp/art.json)
          echo "id=${id:-}" >> "$GITHUB_OUTPUT"
          echo "Poprzedni run ze stanem: ${id:-brak — pierwszy start (seed z 'fresh')}"

      - name: Pobierz stan (pliki z poprzedniego przebiegu)
        if: steps.prev.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xkom-state
          path: state
          run-id: ${{ steps.prev.outputs.id }}
          github-token: ${{ github.token }}

      - name: "Cookies (opcjonalne: YT_COOKIES, IG_COOKIES)"
        # 'secrets' nie działa w warunku 'if' — sprawdzamy w shellu
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          mkdir -p state
          # YouTube: w chmurze (IP datacenter) WYMAGANE, inaczej "Sign in to
          # confirm you're not a bot" przy pobieraniu wideo i opisów.
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" | base64 -d > state/yt_cookies.txt
            echo "Cookies YouTube załadowane."
          else
            echo "Brak sekretu YT_COOKIES — pobieranie wideo może nie działać w chmurze."
          fi
          if [ -n "$IG_COOKIES" ]; then
            echo "$IG_COOKIES" | base64 -d > state/ig_cookies.txt
            echo "Cookies IG załadowane."
          else
            echo "Brak sekretu IG_COOKIES — Instagram wyłączony."
          fi

      - name: Uruchom cykl monitorowania
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XKOM_STATE_DIR: state
        run: python -m xkom.cloud_cycle

      - name: Zapisz stan do następnego przebiegu
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xkom-state
          path: |
            state/yt_seen.json
            state/tt_seen.json
            state/tt_seen_cadence.json
            state/ig_seen.json
            state/bw_state.json
            state/alerted_codes.json
            state/candidates.json
            state/prices.json
          retention-days: 90
