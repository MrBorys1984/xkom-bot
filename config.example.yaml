# ===== Źródła do monitorowania =====
youtube:
  enabled: true
  channel: "https://www.youtube.com/@xkompl"
  tabs: [videos, shorts]      # kody chowają się też w Shorts
  poll_seconds: 20            # co ile sekund sprawdzamy kanał

tiktok:
  enabled: true               # działa BEZ logowania (yt-dlp)
  handle: xkompl

instagram:
  enabled: false              # IG wymaga logowania (cookies z DRUGIEGO konta!)
  handle: xkompl
  cookies_file: "state/ig_cookies.txt"   # format Netscape (rozszerzenie "Get cookies.txt LOCALLY")
  poll_seconds: 90            # rzadziej niż YT/TT — IG agresywnie limituje

# ===== Pobieranie wideo =====
download:
  max_height: 720             # wystarczy do OCR, szybsze pobieranie

# ===== Wyłapywanie kodów (OCR klatek) =====
extract:
  fps_short: 10               # filmy <= long_threshold_sec: klatek na sekundę do OCR
  fps_long: 2                 # dłuższe filmy (rzadko tu kody, oszczędność czasu)
  long_threshold_sec: 120
  max_frames: 300             # limit klatek na wideo (oszczędność czasu w chmurze)
  # pol — polskie słowa zachowują diakrytyki i NIE pasują do wzorca kodu,
  # więc fałszywe pozytywy (SPRZET, UKRYWAMY...) odpadają automatycznie
  ocr_lang: pol
  # format kodów akcji (oficjalny): 6-8 znaków, wielkie litery + cyfry
  # (np. A2C3E4L, 12345678) — patrz extract.py
  # Słowa, których nie traktujemy jako kodów (druga linia obrony —
  # słowa z diakrytykami odpadają już na poziomie ASCII)
  stopwords:
    - XKOM
    - X-KOM
    - XKOMPL
    - XCOM
    - XCOMPL
